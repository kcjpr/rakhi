<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy राखी Nidhi बाईसा ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Kalam:wght@400;700&family=Marcellus&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --cream:#fff4dc;
    --cream2:#ffe5b0;

    --maroon:#681f28;
    --deep-maroon:#351018;

    --red:#a8323b;
    --red-dark:#761e29;

    --pink:#c95b67;
    --gold:#e4b35d;
    --gold-light:#f4d38a;

    --orange:#d77a3b;
    --brown:#4a241c;

    --glass:rgba(62,22,27,.66);

}


/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            #b85255,
            #641f2a 48%,
            #2c1117 100%
        );

    color:var(--cream);

    font-family:
        "Noto Serif Devanagari",
        serif;
}


/* =========================================================
   MAIN
========================================================= */

.page{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(255,193,105,.30),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #8e3038 0%,
            #6a222d 35%,
            #42151e 72%,
            #241017 100%
        );

}


/* =========================================================
   TEXTURE
========================================================= */

.page::before{

    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:.16;

    background-image:

        radial-gradient(
            circle,
            rgba(255,220,160,.8) 1px,
            transparent 1px
        );

    background-size:24px 24px;

}


/* =========================================================
   FESTIVE GLOW
========================================================= */

.glow{

    position:absolute;

    width:700px;
    height:700px;

    left:50%;
    top:35%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,205,110,.35),
            rgba(255,125,80,.12) 35%,
            transparent 70%
        );

    filter:blur(8px);

    pointer-events:none;

}


/* =========================================================
   MANDALA
========================================================= */

.mandala{

    position:absolute;

    left:50%;
    top:50%;

    width:min(850px,90vw);
    height:min(850px,90vw);

    transform:
        translate(-50%,-50%);

    opacity:.12;

    pointer-events:none;

    animation:
        rotateMandala 90s linear infinite;

}

@keyframes rotateMandala{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    position:absolute;

    top:22px;
    left:35px;
    right:35px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    z-index:20;

}

.brand{

    font-family:"Marcellus",serif;

    font-size:11px;

    letter-spacing:4px;

    color:var(--cream2);

}

.badge{

    padding:7px 14px;

    border:1px solid rgba(255,218,150,.4);

    border-radius:30px;

    background:
        rgba(40,10,17,.35);

    backdrop-filter:blur(10px);

    font-size:10px;

    letter-spacing:2px;

}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:absolute;

    left:50%;
    top:47%;

    transform:
        translate(-50%,-50%);

    width:min(1000px,92vw);

    text-align:center;

    z-index:10;

}


/* small heading */

.pre-title{

    font-family:"Kalam",cursive;

    font-size:18px;

    color:#ffd88c;

    margin-bottom:12px;

    letter-spacing:1px;

}


/* MAIN HEADING */

h1{

    margin:0;

    line-height:1;

    text-shadow:

        0 4px 0 rgba(62,15,20,.5),

        0 10px 35px rgba(30,5,10,.45);

}


/* HAPPY */

.happy{

    display:block;

    font-family:"Marcellus",serif;

    font-size:
        clamp(38px,7vw,82px);

    color:#fff1d1;

    letter-spacing:2px;

}


/* RAKHI */

.rakhi{

    display:block;

    margin-top:-2px;

    font-family:"Yatra One",cursive;

    font-size:
        clamp(62px,11vw,145px);

    color:#ffd27a;

    text-shadow:

        0 4px 0 #7b2029,

        0 10px 30px rgba(0,0,0,.35);

}


/* NIDHI */

.nidhi{

    display:inline-block;

    margin-top:-7px;

    padding:0 20px;

    font-family:"Yatra One",cursive;

    font-size:
        clamp(35px,6vw,70px);

    color:#fff1d0;

    transform:rotate(-2deg);

}


/* BAISA */

.baisa{

    font-family:"Kalam",cursive;

    color:#efb75e;

    font-size:.72em;

    margin-left:7px;

}


/* HEART */

.heart{

    display:inline-block;

    color:#ff7180;

    font-family:sans-serif;

    font-size:.65em;

    margin-left:7px;

    animation:
        heartbeat 1.4s ease-in-out infinite;

}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.17);
    }

    30%{
        transform:scale(1);
    }

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    margin:22px auto 0;

    width:min(580px,85vw);

    font-family:
        "Tiro Devanagari Hindi",
        serif;

    font-size:
        clamp(14px,2vw,19px);

    line-height:1.9;

    color:#ffe7bb;

    text-shadow:
        0 2px 10px rgba(30,5,10,.7);

}


/* =========================================================
   RAKHI ILLUSTRATION
========================================================= */

.rakhi-art{

    position:absolute;

    left:50%;
    top:50%;

    width:260px;
    height:260px;

    transform:
        translate(-50%,-50%);

    z-index:-1;

    opacity:.25;

}


/* central rakhi */

.rakhi-circle{

    position:absolute;

    left:50%;
    top:50%;

    width:90px;
    height:90px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #ffe5a2 0 12%,
            #c87838 13% 23%,
            #8c2530 24% 42%,
            #e2ad57 43% 50%,
            transparent 51%
        );

    box-shadow:
        0 0 50px rgba(255,199,96,.4);

}


/* rakhi threads */

.thread{

    position:absolute;

    left:50%;

    top:50%;

    height:4px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e6b258,
            transparent
        );

    transform-origin:left center;

}

.thread.one{
    width:120px;
    transform:rotate(0deg);
}

.thread.two{
    width:120px;
    transform:rotate(45deg);
}

.thread.three{
    width:120px;
    transform:rotate(90deg);
}

.thread.four{
    width:120px;
    transform:rotate(135deg);
}


/* =========================================================
   DECORATIVE FLOWERS
========================================================= */

.flower{

    position:absolute;

    width:15px;
    height:15px;

    border-radius:50%;

    background:#efc36c;

    box-shadow:

        -10px 0 #a93d48,
        10px 0 #a93d48,
        0 -10px #c95a65,
        0 10px #c95a65;

    opacity:.75;

}

.f1{
    left:13%;
    top:25%;
    transform:scale(.7);
}

.f2{
    right:12%;
    top:29%;
    transform:scale(.8);
}

.f3{
    left:19%;
    bottom:30%;
    transform:scale(.55);
}

.f4{
    right:18%;
    bottom:27%;
    transform:scale(.65);
}


/* =========================================================
   BROTHER / SISTER SILHOUETTE
========================================================= */

.people{

    position:absolute;

    bottom:105px;

    left:50%;

    transform:
        translateX(-50%);

    width:420px;
    height:180px;

    z-index:3;

    pointer-events:none;

}


/* ground */

.ground{

    position:absolute;

    left:50%;
    bottom:0;

    width:430px;
    height:40px;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(19,7,10,.55),
            transparent 70%
        );

}


/* brother */

.brother{

    position:absolute;

    left:105px;
    bottom:22px;

    width:80px;
    height:110px;

}


/* head */

.brother .head{

    position:absolute;

    left:22px;
    top:0;

    width:40px;
    height:40px;

    border-radius:50%;

    background:#3b1718;

}


/* body */

.brother .body{

    position:absolute;

    left:7px;
    top:38px;

    width:68px;
    height:75px;

    border-radius:
        28px 28px 10px 10px;

    background:
        linear-gradient(
            90deg,
            #521c23,
            #8f3038,
            #501923
        );

}


/* arm */

.brother .arm{

    position:absolute;

    width:58px;
    height:12px;

    top:54px;
    left:47px;

    border-radius:10px;

    background:#47171b;

    transform:
        rotate(22deg);

}


/* sister */

.sister{

    position:absolute;

    right:95px;
    bottom:20px;

    width:90px;
    height:120px;

}


/* head */

.sister .head{

    position:absolute;

    left:25px;
    top:0;

    width:42px;
    height:42px;

    border-radius:50%;

    background:#3b1718;

}


/* veil */

.sister .veil{

    position:absolute;

    left:5px;
    top:0;

    width:75px;
    height:95px;

    border-radius:
        50% 50% 35% 35%;

    border:
        8px solid rgba(200,76,89,.65);

    border-bottom:0;

}


/* body */

.sister .body{

    position:absolute;

    left:8px;
    top:39px;

    width:76px;
    height:82px;

    border-radius:
        30px 30px 12px 12px;

    background:
        linear-gradient(
            90deg,
            #7d2632,
            #c5525d,
            #76212d
        );

}


/* sister hand */

.sister .arm{

    position:absolute;

    width:60px;
    height:11px;

    top:60px;
    left:-25px;

    border-radius:10px;

    background:#45161a;

    transform:
        rotate(-20deg);

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    position:absolute;

    left:50%;

    bottom:230px;

    transform:
        translateX(-50%);

    width:min(700px,88vw);

    text-align:center;

    z-index:12;

}


.message-text{

    font-family:"Kalam",cursive;

    font-size:
        clamp(16px,2vw,24px);

    color:#ffe7b2;

    transition:
        opacity .6s ease,
        transform .6s ease,
        filter .6s ease;

}


.message-text.out{

    opacity:0;

    transform:
        translateY(10px);

    filter:blur(4px);

}

.message-text.in{

    opacity:1;

    transform:
        translateY(0);

    filter:blur(0);

}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.player{

    position:fixed;

    left:50%;
    bottom:17px;

    transform:
        translateX(-50%);

    z-index:50;

    width:min(880px,94vw);

    min-height:92px;

    display:grid;

    grid-template-columns:
        230px 1fr auto;

    align-items:center;

    gap:18px;

    padding:13px 17px;

    border:

        1px solid
        rgba(255,214,140,.28);

    border-radius:18px;

    background:

        linear-gradient(
            135deg,
            rgba(70,20,28,.91),
            rgba(36,12,18,.88)
        );

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:

        0 20px 60px
        rgba(20,4,9,.55),

        inset 0 1px
        rgba(255,235,190,.08);

}


/* =========================================================
   ALBUM ICON
========================================================= */

.album{

    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;

}


.album-art{

    flex:none;

    width:50px;
    height:50px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,210,130,.3);

    display:grid;

    place-items:center;

    background:

        radial-gradient(
            circle,
            #f0c267 0 6px,
            #8b2d38 7px 17px,
            #4a1721 18px 100%
        );

    box-shadow:
        inset 0 0 18px rgba(0,0,0,.35);

}


.now-label{

    font-size:8px;

    letter-spacing:2px;

    color:#d4a76d;

}


.track{

    margin-top:4px;

    font-family:"Marcellus",serif;

    font-size:13px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.artist{

    margin-top:3px;

    font-size:9px;

    color:#bca083;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

}


.control{

    width:35px;
    height:35px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,220,150,.2);

    background:
        rgba(255,224,160,.06);

    color:#f7d58e;

    cursor:pointer;

    transition:.25s;

}


.control:hover{

    transform:
        translateY(-2px);

    background:
        rgba(255,210,125,.15);

}


.control.main{

    width:48px;
    height:48px;

    background:
        linear-gradient(
            145deg,
            #c95c64,
            #8e2937
        );

    color:white;

    border-color:
        rgba(255,216,143,.45);

    box-shadow:
        0 0 22px
        rgba(225,121,110,.2);

}


/* =========================================================
   VISUALIZER
========================================================= */

.visualizer{

    display:flex;

    align-items:end;

    justify-content:center;

    gap:3px;

    height:30px;

    width:58px;

}


.bar{

    width:3px;

    height:5px;

    background:#e1b259;

    border-radius:3px;

}


.playing .bar:nth-child(1){
    animation:eq1 .6s infinite alternate;
}

.playing .bar:nth-child(2){
    animation:eq2 .45s infinite alternate;
}

.playing .bar:nth-child(3){
    animation:eq3 .7s infinite alternate;
}

.playing .bar:nth-child(4){
    animation:eq2 .5s infinite alternate;
}

.playing .bar:nth-child(5){
    animation:eq1 .55s infinite alternate;
}


@keyframes eq1{
    to{height:24px}
}

@keyframes eq2{
    to{height:15px}
}

@keyframes eq3{
    to{height:28px}
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap{

    grid-column:
        2 / 3;

    display:flex;

    align-items:center;

    gap:8px;

}


.time{

    width:34px;

    text-align:center;

    font-size:8px;

    color:#b89a76;

}


.progress{

    flex:1;

    height:4px;

    border-radius:10px;

    background:
        rgba(255,239,204,.14);

    cursor:pointer;

}


.progress-fill{

    width:0%;

    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #a93a48,
            #efbf68
        );

}


/* =========================================================
   PLAY BUTTON
========================================================= */

.start{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:40;

    padding:15px 27px;

    border-radius:40px;

    border:
        1px solid
        rgba(255,222,160,.55);

    background:
        rgba(70,20,27,.62);

    backdrop-filter:
        blur(12px);

    color:#ffe6b1;

    font-size:11px;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 15px 45px
        rgba(30,5,10,.35);

    transition:.3s;

}


.start:hover{

    transform:
        translate(-50%,-53%);

    background:
        rgba(130,40,50,.75);

}


.start.hidden{

    opacity:0;

    pointer-events:none;

}


/* =========================================================
   R BUTTON
========================================================= */

.mode{

    position:fixed;

    right:20px;
    bottom:125px;

    z-index:60;

    width:43px;
    height:43px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,220,150,.3);

    background:
        rgba(45,13,20,.65);

    color:#f4c970;

    cursor:pointer;

    font-family:"Yatra One",cursive;

    font-size:17px;

    backdrop-filter:
        blur(10px);

}


/* =========================================================
   YOUTUBE
========================================================= */

#youtube-player{

    position:absolute;

    width:1px;
    height:1px;

    opacity:.01;

    left:-100px;
    top:-100px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .topbar{

        left:18px;
        right:18px;

    }

    .brand{

        font-size:8px;
        letter-spacing:2px;

    }

    .badge{

        font-size:7px;

        padding:
            6px 9px;

    }


    .hero{

        top:41%;

    }


    .pre-title{

        font-size:14px;

    }


    .subtitle{

        font-size:12px;

        width:80vw;

        line-height:1.7;

    }


    .people{

        bottom:100px;

        transform:
            translateX(-50%)
            scale(.75);

    }


    .message{

        bottom:270px;

    }


    .message-text{

        font-size:15px;

    }


    .player{

        width:
            calc(100vw - 18px);

        bottom:8px;

        min-height:84px;

        grid-template-columns:
            1fr auto;

        gap:7px;

        padding:10px;

    }


    .album-art{

        width:40px;
        height:40px;

    }


    .track{

        font-size:10px;

    }


    .controls{

        gap:4px;

    }


    .control{

        width:29px;
        height:29px;

    }


    .control.main{

        width:40px;
        height:40px;

    }


    .visualizer{

        display:none;

    }


    .progress-wrap{

        grid-column:
            1 / 3;

    }


    .mode{

        right:12px;
        bottom:105px;

        width:38px;
        height:38px;

    }

}


@media(max-width:480px){

    .hero{

        top:38%;

    }


    .happy{

        font-size:40px;

    }


    .rakhi{

        font-size:72px;

    }


    .nidhi{

        font-size:37px;

    }


    .subtitle{

        display:none;

    }


    .people{

        transform:
            translateX(-50%)
            scale(.58);

        bottom:90px;

    }


    .message{

        bottom:195px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;

    }

}

</style>
</head>


<body>


<div class="page">

    <div class="glow"></div>


    <!-- =====================================================
         MANDALA
    ====================================================== -->

    <svg
        class="mandala"
        viewBox="0 0 500 500"
        xmlns="http://www.w3.org/2000/svg">

        <g
            fill="none"
            stroke="#f4c76e"
            stroke-width="1.2">

            <circle
                cx="250"
                cy="250"
                r="220"/>

            <circle
                cx="250"
                cy="250"
                r="190"/>

            <circle
                cx="250"
                cy="250"
                r="150"/>

            <circle
                cx="250"
                cy="250"
                r="110"/>

            <circle
                cx="250"
                cy="250"
                r="70"/>


            <g>

                <path d="M250 30 L275 250 L250 470 L225 250 Z"/>
                <path d="M30 250 L250 275 L470 250 L250 225 Z"/>

                <path d="M94 94 L250 250 L406 406"/>
                <path d="M406 94 L250 250 L94 406"/>

            </g>

        </g>

    </svg>


    <!-- =====================================================
         DECORATIVE FLOWERS
    ====================================================== -->

    <div class="flower f1"></div>
    <div class="flower f2"></div>
    <div class="flower f3"></div>
    <div class="flower f4"></div>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <div class="brand">
            FROM THE HEART ❤️
        </div>

        <div class="badge">
            RAKSHA BANDHAN • 2026
        </div>

    </header>


    <!-- =====================================================
         HERO
    ====================================================== -->

    <main class="hero">

        <div class="pre-title">
            एक रिश्ता... जो हमेशा साथ रहता है
        </div>


        <h1>

            <span class="happy">
                Happy
            </span>

            <span class="rakhi">
                राखी
            </span>

            <span class="nidhi">

                Nidhi

                <span class="baisa">
                    बाईसा
                </span>

                <span class="heart">
                    ❤️
                </span>

            </span>

        </h1>


        <p class="subtitle">


            भाई-बहन का रिश्ता यूँ ही

<button

<!-- =========================================================
     MUSIC PLAYER
========================================================= -->

<div
    id="player"
    class="player">


    <div class="album">

        <div class="album-art">
            ♡
        </div>

        <div style="min-width:0">

            <div class="now-label">
                RAKHI RADIO
            </div>

            <div
                id="trackName"
                class="track">

                भाई-बहन के गीत

            </div>

                A SPECIAL PLAYLIST FOR NIDHI बाईसा

            </div>

        </div>

    </div>


    <div>

        <div class="controls">

            <button
                id="prev"
                class="control"
                aria-label="Previous song">

                ◀

            </button>

                id="play"

                id="progressFill"

<!-- Hidden YouTube player -->

<div id="youtube-player"></div>


<script>

/* =========================================================
   YOUTUBE PLAYLIST
========================================================= */

const PLAYLIST_ID =
    "PL50BD67FD8A0BDA0D";


let player;

let isReady = false;

let isPlaying = false;


/* =========================================================
   LOAD YOUTUBE API
========================================================= */

const tag =
    document.createElement("script");

tag.src =
    "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);


/* =========================================================
   YOUTUBE INITIALIZE
========================================================= */

function onYouTubeIframeAPIReady(){

    player =
        new YT.Player(
            "youtube-player",
            {

                height:"1",
                width:"1",

                playerVars:{

                    listType:"playlist",

                    list:
                        PLAYLIST_ID,

                    autoplay:0,

                    controls:0,

                    playsinline:1,

                    rel:0,

                    modestbranding:1

                },

                events:{

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange

                }

            }
        );

}


/* =========================================================
   READY
========================================================= */

function onPlayerReady(){

    isReady = true;

}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event){

    const playButton =
        document.getElementById("play");

    const playerBox =
        document.getElementById("player");


    if(
        event.data ===
        YT.PlayerState.PLAYING
    ){

        isPlaying = true;

        playButton.textContent =
            "Ⅱ";

        playerBox.classList.add(
            "playing"
        );

        document
            .getElementById("startButton")
            .classList.add("hidden");

    }

    else{

        isPlaying = false;

        playButton.textContent =
            "▶";

        playerBox.classList.remove(
            "playing"
        );

    }


    updateTrackInfo();

}


/* =========================================================
   START
========================================================= */

function startMusic(){

    if(!isReady)
        return;

    player.playVideo();

}


/* =========================================================
   START BUTTON
========================================================= */

document
    .getElementById("startButton")
    .addEventListener(
        "click",
        startMusic
    );


/* =========================================================
   PLAY / PAUSE
========================================================= */

document
    .getElementById("play")
    .addEventListener(
        "click",
        function(){

            if(!isReady)
                return;


            if(isPlaying){

                player.pauseVideo();

            }

            else{

                player.playVideo();

            }

        }
    );


/* =========================================================
   NEXT
========================================================= */

document
    .getElementById("next")
    .addEventListener(
        "click",
        function(){

            if(isReady)
                player.nextVideo();

        }
    );


/* =========================================================
   PREVIOUS
========================================================= */

document
    .getElementById("prev")
    .addEventListener(
        "click",
        function(){

            if(isReady)
                player.previousVideo();

        }
    );


/* =========================================================
   TRACK INFO
========================================================= */

function updateTrackInfo(){

    if(!isReady)
        return;


    try{

        const data =
            player.getVideoData();


        if(
            data &&
            data.title
        ){

            document
                .getElementById("trackName")
                .textContent =
                data.title;

        }

    }

    catch(e){}

}


/* =========================================================
   PROGRESS
========================================================= */

setInterval(

    function(){

        if(
            !isReady ||
            !isPlaying
        )
            return;


        try{

            const current =
                player.getCurrentTime();


            const duration =
                player.getDuration();


            if(duration > 0){

                const percent =
                    current /
                    duration *
                    100;


                document
                    .getElementById(
                        "progressFill"
                    )
                    .style.width =
                    percent + "%";


                document
                    .getElementById(
                        "currentTime"
                    )
                    .textContent =
                    formatTime(current);


                document
                    .getElementById(
                        "duration"
                    )
                    .textContent =
                    formatTime(duration);

            }

        }

        catch(e){}

    },

    500

);


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds){

    seconds =
        Math.floor(seconds || 0);


    const minutes =
        Math.floor(seconds / 60);


    const secondsPart =
        String(
            seconds % 60
        ).padStart(2,"0");


    return (
        minutes +
        ":" +
        secondsPart
    );

}


/* =========================================================
   SEEK
========================================================= */

document
    .getElementById("progress")
    .addEventListener(
        "click",
        function(e){

            if(!isReady)
                return;


            const rect =
                this.getBoundingClientRect();


            const percent =
                (
                    e.clientX -
                    rect.left
                ) /
                rect.width;


            const duration =
                player.getDuration();


            player.seekTo(
                duration * percent,
                true
            );

        }
    );


/* =========================================================
   RAKHI MESSAGES
========================================================= */

const messages = [

    "भाई-बहन का रिश्ता... थोड़ा प्यार, थोड़ी नोकझोंक और ढेर सारी यादें। ❤️",

    "भाई कितना भी बड़ा हो जाए, बहन के लिए हमेशा वही छोटा सा भाई रहता है।",

    "कुछ रिश्ते शब्दों से नहीं, यादों से बने होते हैं।",

    "नोकझोंक चाहे कितनी भी हो... साथ हमेशा बना रहता है।",

    "दूरियाँ कितनी भी हों, भाई-बहन का रिश्ता दिल के पास रहता है।",

    "Happy Raakhi बाईसा — हमेशा खुश रहो, हमेशा मुस्कुराती रहो। ❤️"

];


let messageIndex = 0;


setInterval(

    function(){

        const el =
            document.getElementById(
                "messageText"
            );


        el.classList.remove("in");

        el.classList.add("out");


        setTimeout(

            function(){

                messageIndex =
                    (
                        messageIndex + 1
                    ) %
                    messages.length;


                el.textContent =
                    messages[messageIndex];


                el.classList.remove(
                    "out"
                );

                el.classList.add(
                    "in"
                );

            },

            600

        );

    },

    5000

);


/* =========================================================
   RAKHI MODE
========================================================= */

document
    .getElementById("modeButton")
    .addEventListener(
        "click",
        function(){

            document.body.classList.toggle(
                "special"
            );

            this.textContent =
                document.body.classList.contains(
                    "special"
                )
                ? "❤️"
                : "र";

        }
    );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

    "keydown",

    function(e){

        if(
            e.key.toLowerCase() === "r"
        ){

            document
                .getElementById(
                    "modeButton"
                )
                .click();

        }

    }

);


/* =========================================================
   SIMPLE RAKHI SOUND
========================================================= */

let audioContext;


function littleBell(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const osc =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        osc.type =
            "sine";


        osc.frequency.setValueAtTime(
            660,
            audioContext.currentTime
        );


        osc.frequency.exponentialRampToValueAtTime(
            880,
            audioContext.currentTime + .12
        );


        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .06,
            audioContext.currentTime + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + .35
        );


        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );


        osc.start();


        osc.stop(
            audioContext.currentTime + .4
        );

    }

    catch(e){}

}


/* click decorative elements */

document
    .querySelectorAll(".flower,.rakhi-art")
    .forEach(

        element => {

            element.addEventListener(
                "click",
                littleBell
            );

        }

    );


</script>
